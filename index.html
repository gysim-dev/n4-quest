function reachableAll(){let q=[[1,1]],s=new Set(['1,1']);for(let i=0;i<q.length;i++){let [x,y]=q[i];for(let [dx,dy] of [[1,0],[-1,0],[0,1],[0,-1]]){let nx=x+dx,ny=y+dy,k=`${nx},${ny}`;if(grid[ny]?.[nx]!==undefined&&grid[ny][nx]!=='#'&&!s.has(k)){s.add(k);q.push([nx,ny])}}}return grid.flat().filter(c=>c!== '#').length===s.size}
function reveal(){for(let dy=-2;dy<=2;dy++)for(let dx=-2;dx<=2;dx++)if(Math.abs(dx)+Math.abs(dy)<=3)seen.add(`${player.x+dx},${player.y+dy}`)}function tile(x,y,c){ctx.fillStyle=c;ctx.fillRect(x*T,y*T,T,T)}function draw(){ctx.clearRect(0,0,480,384);for(let y=0;y<H;y++)for(let x=0;x<W;x++){let k=`${x},${y}`,c=grid[y][x];if(!seen.has(k)){tile(x,y,'#080c13');continue}tile(x,y,c==='#'?'#38435b':(x+y)%2?'#1c2738':'#202c3e');if(c==='#'){ctx.fillStyle='#495772';ctx.fillRect(x*T+2,y*T+3,28,4);ctx.fillStyle='#29344a';ctx.fillRect(x*T+2,y*T+16,12,2);ctx.fillRect(x*T+18,y*T+25,12,2)}else if(c==='M')drawSprite(ctx,'slime',x*T+2,y*T+1+Math.round(Math.sin(Date.now()/260+x)*1.5),2.3);else if(c==='C')drawSprite(ctx,'chest',x*T+2,y*T+1,2.3);else if(c==='H')drawSprite(ctx,'fountain',x*T+2,y*T+1,2.3);else if(c==='S')drawSprite(ctx,'stairs',x*T+2,y*T+1,2.3)}drawHero();}
function drawHero(){let x=player.x*T+2,y=player.y*T+1;ctx.save();if(facing==='left'){ctx.translate(x+28,0);ctx.scale(-1,1);x=0}let walking=Date.now()<walkUntil,step=walking?walkFrame%2:0;drawSprite(ctx,'hero',x,y+(walking?(step?1:-1):0),2.3);if(facing==='up'){ctx.fillStyle='#3764ad';ctx.fillRect(x+8,y+9,12,7);ctx.fillStyle='#172036';ctx.fillRect(x+11,y+5,7,4)}else if(facing==='down'){ctx.fillStyle='#f6c99d';ctx.fillRect(x+9,y+11,10,5)}if(walking){ctx.fillStyle='#172036';ctx.fillRect(x+6,y+24+(step?2:0),5,3);ctx.fillRect(x+18,y+24+(step?0:2),5,3)}ctx.restore()}
let animationTick=0;function animateWorld(){if(!document.hidden&&!busy&&grid.length&&Date.now()-animationTick>110){animationTick=Date.now();draw()}requestAnimationFrame(animateWorld)}requestAnimationFrame(animateWorld);


function move(dx,dy){if(busy||stats.hp<=0)return;let x=player.x+dx,y=player.y+dy;if(grid[y]?.[x]===undefined||grid[y][x]==='#')return;facing=dx<0?'left':dx>0?'right':dy<0?'up':'down';walkFrame++;walkUntil=Date.now()+230;player={x,y};reveal();let c=grid[y][x];if(c==='M'){busy=true;encounter={x,y};let type=MONSTERS[Math.min(MONSTERS.length-1,rand(Math.min(5,2+Math.floor(stats.floor/2))))];foe={...type,hp:type.hp,max:type.hp};ask()}else if(c==='C'){let g=10+rand(21);stats.gold+=g;grid[y][x]='.';log(`보물 상자! ${g}G 획득`)}else if(c==='H'){let h=Math.min(stats.maxHp-stats.hp,20+rand(16));stats.hp+=h;grid[y][x]='.';log(`회복의 샘! HP +${h}`)}else if(c==='S'){busy=true;offerRelics();draw();return}draw();update()}
function openModal(title,desc){$('modalTitle').textContent=title;$('modalDesc').textContent=desc;$('question').textContent='';$('choices').innerHTML='';$('feedback').textContent='';$('continue').style.display='none';$('explanation').style.display='none';$('battleStage').style.display='none';$('battleStage').className='battle-stage';$('overlay').classList.add('show')}
const RELICS=[
{id:'blade',name:'⚔ 지식의 검',desc:'정답 시 골드 +5',apply:()=>{}},
{id:'armor',name:'🛡 수호의 갑옷',desc:'오답 피해 5 감소',apply:()=>{}},
{id:'potion',name:'💚 생명의 부적',desc:'정답 시 HP 3 회복',apply:()=>{}},
{id:'heart',name:'♥ 붉은 수정',desc:'최대 HP +20, 즉시 HP +20',apply:()=>{stats.maxHp+=20;stats.hp+=20}},
{id:'shield',name:'🔰 마법 방패',desc:'즉시 방어막 25 획득',apply:()=>{stats.shield+=25}},
{id:'coin',name:'◆ 황금 주머니',desc:'획득 골드 50% 증가',apply:()=>{}},
{id:'rest',name:'🌿 회복의 잎',desc:'즉시 HP 40 회복',apply:()=>{stats.hp=Math.min(stats.maxHp,stats.hp+40)}}
];
function hasRelic(id){return stats.relics.includes(id)}
function offerRelics(){
 const pool=shuffle(RELICS.filter(r=>!hasRelic(r.id))).slice(0,3);
 if(!pool.length){advanceFloor();return}
 openModal('층 클리어! 유물 선택','다음 층으로 내려가기 전에 강화 1개를 선택하세요. 유물 효과는 이번 탐험 동안 유지됩니다.');
 $('question').textContent=`B${stats.floor}F 완료`;
 $('choices').innerHTML='';
 for(const r of pool){const b=document.createElement('button');b.textContent=`${r.name} — ${r.desc}`;b.onclick=()=>{stats.relics.push(r.id);r.apply();log(`${r.name} 획득!`);$('overlay').classList.remove('show');busy=false;advanceFloor()};$('choices').appendChild(b)}
}
function advanceFloor(){stats.floor++;record.best=Math.max(record.best,stats.floor);save();makeFloor()}
const REVIEW_STEPS=[10/1440,1,3,7,14,30];
function qKey(i){return i<BANK.length?'w:'+i:'g:'+(i-BANK.length)}
function scheduleAnswer(q,correct){let now=Date.now(),v=record.srs[q.id]||{step:-1,wrong:0,correct:0};if(correct){v.correct++;v.step=Math.min(5,v.step+1);v.due=now+REVIEW_STEPS[v.step]*86400000;v.lastCorrect=now}else{v.wrong++;v.step=-1;v.due=now+10*60000;v.lastWrong=now;reviewQueue=reviewQueue.filter(x=>x.id!==q.id);reviewQueue.push({id:q.id,at:battleCount+3})}v.last=now;record.srs[q.id]=v}
function makeQuestion(id){if(id<BANK.length){let item=BANK[id],type=rand(3),field=type===0?2:type===1?0:1,answer=item[field];let options=shuffle([answer,...shuffle(BANK.filter(v=>v!==item&&v[field]!==answer)).slice(0,3).map(v=>v[field])]);return {id:qKey(id),key:item[0],stem:type===0?`「${item[0]}（${item[1]}）」의 뜻은?`:type===1?`「${item[2]}」에 해당하는 일본어는?`:`「${item[0]}」의 읽는 법은?`,answer,options,kind:'word',explain:`${item[0]}（${item[1]}） = ${item[2]}`}}let g=GRAMMAR[id-BANK.length];return {id:qKey(id),key:g[0],stem:g[0],answer:g[2],options:shuffle(g.slice(3,7)),kind:'grammar',note:GRAMMAR_NOTES[id-BANK.length],explain:`문장 뜻: ${g[1]} · 정답 표현: ${g[2]}`}}
function nextQuestion(){let total=BANK.length+GRAMMAR.length,now=Date.now(),pool=Array.from({length:total},(_,i)=>i).filter(i=>!used.has(i));if(!pool.length){used.clear();pool=Array.from({length:total},(_,i)=>i)}let retry=reviewQueue.find(x=>x.at<=battleCount);if(retry){reviewQueue=reviewQueue.filter(x=>x!==retry);let id=Array.from({length:total},(_,i)=>i).find(i=>qKey(i)===retry.id);used.add(id);return makeQuestion(id)}let due=pool.filter(i=>record.srs[qKey(i)]?.due<=now);let unseen=pool.filter(i=>!record.srs[qKey(i)]);let future=pool.filter(i=>record.srs[qKey(i)]?.due>now);let chosen;if(reviewMode){if(!due.length)return null;chosen=due[rand(due.length)]}else{let roll=Math.random();let source=due.length&&roll<.65?due:unseen.length?unseen:due.length?due:future;chosen=source[rand(source.length)]}used.add(chosen);return makeQuestion(chosen)}
function animateBattle(kind){paintSprite($('heroSprite'),'hero',walkFrame++);paintSprite($('enemySprite'),foe.sprite,walkFrame);let stage=$('battleStage');stage.className='battle-stage';void stage.offsetWidth;stage.classList.add(kind);setTimeout(()=>{if(stage.classList.contains(kind))stage.classList.remove(kind)},720)}
function ask(){question=nextQuestion();if(!question){reviewMode=false;openModal('오늘의 복습 완료','현재 복습 예정인 문제를 모두 풀었습니다. 새로운 문제가 복습 시점에 다시 등장합니다.');$('continue').style.display='inline-block';$('continue').textContent='던전으로 돌아가기';$('continue').onclick=normalContinue;return}openModal(`⚔ ${foe.name} · B${stats.floor}F`,'정답으로 공격하세요. 몬스터의 체력을 모두 깎으면 처치합니다.');$('battleStage').style.display='flex';paintSprite($('enemySprite'),foe.sprite,walkFrame++);$('enemyHp').textContent=`${foe.name} HP ${foe.hp}/${foe.max}`;$('question').textContent=question.stem;question.options.forEach((o,i)=>{let b=document.createElement('button');b.textContent=`${i+1}. ${o}`;b.dataset.value=o;b.onclick=()=>answer(o);$('choices').appendChild(b)})}
function answer(value){if(!question)return;let q=question,correct=value===q.answer;battleCount++;scheduleAnswer(q,correct);document.querySelectorAll('#choices button').forEach(b=>{b.disabled=true;if(b.dataset.value===q.answer)b.style.borderColor='#6adfa0';else if(b.dataset.value===value)b.style.borderColor='#f27683'});
let explanation=`정답: ${q.answer}\n${q.explain}`;if(q.kind==='word')explanation+=`\n학습 포인트: 한자 표기, 히라가나 읽기, 한국어 뜻을 함께 기억하세요.`;else explanation+=`\n문법 포인트: ${q.note||'빈칸 앞뒤의 활용과 문장 의미를 확인하세요.'}`;
$('explanation').textContent=explanation;$('explanation').style.display='block';let cleared=false;
if(correct){record.correct++;if(!reviewMode)foe.hp--;animateBattle(foe.hp<=0?'defeat':'hit');if(foe.hp<=0){cleared=true;stats.kills++;let g=5+stats.floor*3+(hasRelic('blade')?5:0);if(hasRelic('coin'))g=Math.ceil(g*1.5);stats.gold+=g;$('feedback').textContent=`정답! ${foe.name} 처치 · +${g}G`;log(`${foe.name} 처치!`)}else{$('feedback').textContent=`정답! 공격 성공 · ${foe.name} HP ${foe.hp}/${foe.max}`;}if(hasRelic('potion'))stats.hp=Math.min(stats.maxHp,stats.hp+3)}else{record.wrong++;record.mistakes[q.key]=(record.mistakes[q.key]||0)+1;let damage=Math.max(1,10+stats.floor*3+foe.damage-(hasRelic('armor')?5:0));let blocked=Math.min(stats.shield,damage);stats.shield-=blocked;damage-=blocked;if(reviewMode)damage=0;stats.hp=Math.max(0,stats.hp-damage);animateBattle('enemy-attack');$('feedback').textContent=`오답! ${foe.name}의 반격 · HP -${damage}`;log(`${foe.name}에게 피해 ${damage}`)}
if(cleared&&!reviewMode&&encounter)grid[encounter.y][encounter.x]='.';save();update();draw();$('enemyHp').textContent=`${foe.name} HP ${foe.hp}/${foe.max}`;$('continue').style.display='inline-block';$('continue').textContent=stats.hp===0?'결과 보기 →':reviewMode?'다음 복습 →':cleared?'탐험 계속 →':'다음 문제 →';question=null;$('continue').onclick=()=>{if(stats.hp<=0){showGameOver();return}if(reviewMode){ask();return}if(!cleared){ask();return}normalContinue()}}
function showGameOver(){openModal('탐험 실패',`${stats.floor}층에서 쓰러졌습니다. 누적 정답 ${record.correct}회, 오답 ${record.wrong}회. 학습 기록은 유지됩니다.`);$('continue').style.display='inline-block';$('continue').textContent='다시 도전';$('continue').onclick=()=>{resetRun();normalContinue()}}
function resetRun(){stats={floor:1,hp:100,maxHp:100,gold:0,kills:0,relics:[],shield:0};busy=false;foe=null;makeFloor()}
function normalContinue(){reviewMode=false;busy=false;$('overlay').classList.remove('show')}
$('reviewNow').onclick=()=>{if(busy)return;let count=Object.values(record.srs).filter(v=>v.due<=Date.now()).length;if(!count){alert('현재 복습 예정 문제가 없습니다. 던전에서 새 문제를 학습해 보세요.');return}reviewMode=true;busy=true;used.clear();foe={...MONSTERS[0],hp:999,max:999};ask()};$('restart').onclick=()=>{if(!confirm('현재 탐험을 초기화할까요? 학습 기록은 유지됩니다.'))return;resetRun();$('overlay').classList.remove('show')};$('help').onclick=()=>{openModal('게임 방법','방향키·WASD 또는 화면 버튼으로 던전을 탐험하세요. 몬스터를 만나면 랜덤 N4 4지선다 문제가 나옵니다. 정답이면 처치, 오답이면 피해를 받습니다. 보물·회복을 활용하고 보라색 계단을 찾아 다음 층으로 내려가세요. 층을 클리어할 때마다 유물 3개 중 하나를 선택할 수 있습니다.');$('continue').style.display='inline-block';$('continue').textContent='닫기';$('continue').onclick=normalContinue};$('resetRecord').onclick=()=>{if(confirm('누적 정답·오답·최고 층 기록을 삭제할까요?')){record={correct:0,wrong:0,best:1,mistakes:{},srs:{}};reviewQueue=[];save();update()}};document.querySelectorAll('[data-dir]').forEach(b=>b.onclick=()=>{let d={up:[0,-1],down:[0,1],left:[-1,0],right:[1,0]}[b.dataset.dir];move(...d)});document.addEventListener('keydown',e=>{if(busy)return;let d={ArrowUp:[0,-1],w:[0,-1],ArrowDown:[0,1],s:[0,1],ArrowLeft:[-1,0],a:[-1,0],ArrowRight:[1,0],d:[1,0]}[e.key];if(d){e.preventDefault();move(...d)}});makeFloor();
</script></body></html>
